<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuaire des Artisans</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <a href="/admin.html" class="lien-admin">Gestion </a>

        <div class="hero-content">
            <h1> Trouvez l'artisan qu'il vous faut</h1>
            <p>Plombiers, couturières, électriciens... Les meilleurs talents de votre ville.</p>

            <div class="search-bar">
                <input type="text" id="recherche-globale" placeholder="Rechercher un artisan, un métier, une ville...">
                <button id="btn-recherche">Rechercher</button>
            </div>

        </div>

    </header>

    <main>
        <section class="stats">
            <div class="stat-card">
                <h3 id="stat-total">0</h3>
                <p>Artisans</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-metiers">0</h3>
                <p>Métiers</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-villes">0</h3>
                <p>Villes</p>
            </div>
        </section>

        <section class="filtres-metiers" id="filtres-metiers"></section>

        <section id="liste-artisans" class="grille-artisans"></section>
    </main>

    <!-- laisser un avis -->
    <div id="modale-avis" class="modale cache">
        <div class="modale-contenu">
            <h2>Laisser un avis</h2>
            <form id="form-avis">
                <input type="hidden" id="avis-artisan-id">
                <input type="text" id="avis-auteur" placeholder="Votre nom" required>
                <select id="avis-note" required>
                    <option value="5"> (5/5)</option>
                    <option value="4"> (4/5)</option>
                    <option value="3"> (3/5)</option>
                    <option value="2"> (2/5)</option>
                    <option value="1"> (1/5)</option>
                </select>
                <textarea id="avis-commentaire" placeholder="Votre commentaire..."></textarea>
                <div class="modale-boutons">
                    <button type="submit">Envoyer</button>
                    <button type="button" onclick="fermerModale()" class="btn-annuler">Annuler</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
